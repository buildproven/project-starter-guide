name: Template Smoke Tests

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'scripts/template-smoke-test.sh'
      - '.github/workflows/template-smoke-tests.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.scope.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select affected templates
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all='["saas-level-1","api-service","mobile-app","about-me-page"]'
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo "templates=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(scripts/template-smoke-test\.sh|\.github/workflows/template-smoke-tests\.yml)$'; then
            echo "templates=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          selected=()
          for template in saas-level-1 api-service mobile-app about-me-page; do
            if printf '%s\n' "$changed" | grep -q "^templates/$template/"; then
              selected+=("$template")
            fi
          done

          json="$(printf '%s\n' "${selected[@]}" | node -e "
            const fs = require('fs')
            const names = fs.readFileSync(0, 'utf8').split(/\\n/).filter(Boolean)
            process.stdout.write(JSON.stringify(names))
          ")"
          echo "templates=$json" >> "$GITHUB_OUTPUT"

  smoke-test:
    needs: changes
    if: needs.changes.outputs.templates != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.changes.outputs.templates) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.template != 'about-me-page'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: templates/${{ matrix.template }}/package-lock.json

      - name: Run affected template smoke test
        env:
          CI: true
        run: bash scripts/template-smoke-test.sh "${{ matrix.template }}"

  deep-audit:
    if: github.event_name != 'pull_request'
    needs: smoke-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: saas-level-1
            command: npm run test:coverage && npm run test:accessibility
          - template: api-service
            command: npm run test:coverage && npm run perf:smoke
          - template: mobile-app
            command: npm run test:coverage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: templates/${{ matrix.template }}/package-lock.json

      - name: Install dependencies
        working-directory: templates/${{ matrix.template }}
        run: npm ci --no-audit --no-fund

      - name: Run scheduled deep audit
        working-directory: templates/${{ matrix.template }}
        env:
          CI: true
          PRISMA_GENERATE_SKIP: 1
          DATABASE_URL: file:./dev.db
          JWT_SECRET: ci-deep-audit-secret-32-characters
          NEXTAUTH_SECRET: ci-deep-audit-secret-32-characters
          NEXTAUTH_URL: http://localhost:3100
        run: ${{ matrix.command }}
